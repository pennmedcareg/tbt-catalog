<html lang="en">
<head>
<meta charset="utf-8">

<title>New Hire Training Rotation Calendar</title>

.tabs button.on{background:var(--bg);color:var(--navy);font-weight:600}
.status{position:absolute;right:24px;top:20px;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:12px}
main{padding:20px 24px 40px;max-width:1280px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.months{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.months button,.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:18px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.months button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;line-height:1.3}
.k-Casefinding{background:var(--cf);color:var(--cfi)}.k-Abstracting{background:var(--ab);color:var(--abi)}
.k-Follow-up{background:var(--fu);color:var(--fui)}.k-Orientation,.k-Meet{background:var(--or);color:var(--ori)}
.k-Holiday{background:var(--ho);color:var(--hoi)}.k-PTO{background:var(--pto);color:var(--ptoi)}.k-Other,.k-Training{background:var(--ot);color:var(--oti)}.k-Review{background:#d9f2ef;color:#14665c}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.dow{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}

.day:hover{border-color:#9aa8c4}
.day.out{background:transparent;border-style:dashed;cursor:default;opacity:.45}
.day .dn{font-weight:600;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between}
.day .hol{font-size:11px;color:var(--red);font-weight:500}
.day .ent{display:flex;gap:6px;align-items:baseline;margin:3px 0;font-size:12px}
.day .who{width:22px;flex:none;font-weight:600;color:var(--mute);font-size:11px}
.day .ent .pill{flex:1;padding:2px 6px}

table{border-collapse:collapse;width:100%;background:#fff}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:13px;vertical-align:middle}
th{background:#f0f2f6;font-weight:600;position:sticky;top:0;z-index:1}
th.grp{text-align:center;background:var(--navy);color:#fff}
tr.month-start td{border-top:2px solid #c9d2e3}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.sc{border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.sc h3{margin:0 0 8px;font-size:14px}

.sc .kv small,.ov small{font-weight:400;color:var(--mute)}
.sc .kv.good b,td.good{color:#1b7a2e}.sc .kv.bad b,td.bad{color:#b42318}
.sc .kv.good b:after{content:" ✓"}.sc .kv.bad b:after{content:" ✗"}

table.log input.lg{font:inherit;font-size:13px;padding:4px 6px;border:1px solid #cfd5df;border-radius:6px}
table.log tr.nm td{background:#fafbfc}
td.mpc{font-weight:600;color:var(--navy)}td.mpc.bad{color:#b42318}

.chk label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.chk input{margin-top:2px}

.prog{height:8px;background:#e9ecf2;border-radius:6px;overflow:hidden;margin-top:6px}

.plan li{margin-bottom:2px}
</style>
</head>

  const ms=MONTHS.map(([yy,mm],i)=>`<button data-m="${i}" class="${i===mi?'on':''}">${new Date(Date.UTC(yy,mm,1)).toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'})}</button>`).join('');

// ---- Productivity log
let lp=0, lm=null;
const MEAS={"Abstracting":"a","Casefinding":"c","Follow-up":"f"};
const ANAME={a:"Abstracting",c:"Casefinding",f:"Follow-up"};
const pnum=v=>{const x=parseFloat(String(v).replace('%',''));return isNaN(x)?null:x};
function planMonth(p,d){const n=Math.floor((D(d)-D(S.starts[p]))/864e5)+1;return n<1?0:n>180?7:Math.ceil(n/30)}
function logDays(p,m){const out=[];const s=m===7?dayN(p,181):dayN(p,(m-1)*30+1), e=m===7?LAST_WEEK_END:dayN(p,m*30);
  for(let d=s;d<=e;d=add(d,1)){if(dow(d)>4)continue;const a=dayAct(d,p);if(!a)continue;out.push([d,a])}return out}
const LAST_WEEK_END=add(LAST_WEEK,4);
function entry(p,d){return (S.log[p]&&S.log[p][d])||{}}
function summarize(p,m){const t={a:{},c:{},f:{}};Object.keys(t).forEach(k=>Object.assign(t[k],{days:0,cases:0,mins:0,qa:0,accw:0}));
  logDays(p,m).forEach(([d,a])=>{const k=MEAS[a];if(!k)return;const e=entry(p,d),c=pnum(e.c),mi=pnum(e.m),q=pnum(e.q),ok=pnum(e.ok);
    if(c===null&&mi===null&&q===null)return;const x=t[k];x.days++;x.cases+=c||0;x.mins+=mi||0;if(q){x.qa+=q;if(ok!==null){x.ok=(x.ok||0)+ok;x.okq=(x.okq||0)+q}}});
  return t}
const r1=v=>Math.round(v*10)/10;
function goalFor(k,m){const i=Math.min(m,7)-1;const row=KPI[i];const g=row[{a:3,c:4,f:5}[k]];return {mins:S.mins[k][i],qa:pnum(g[0]),acc:pnum(g[2])}}
function sumCards(p,m){const t=summarize(p,m);
  return Object.keys(t).map(k=>{const x=t[k],g=goalFor(k,m);const mpc=x.cases?x.mins/x.cases:null;const qap=x.cases?x.qa/x.cases*100:null;const acc=x.okq?x.ok/x.okq*100:null;
    const ok=(v,good)=>v===null?'':good?'good':'bad';
    return `<div class="sc ${'k-'+ANAME[k]}"><h3>${ANAME[k]}</h3>
    <div class="kv"><span>Days logged</span><b>${x.days}</b></div>
    <div class="kv"><span>Total cases</span><b>${x.cases}</b></div>
    <div class="kv"><span>Total time</span><b>${x.mins.toLocaleString()} min${x.mins?` <small>(${r1(x.mins/60)} hrs)</small>`:''}</b></div>
    <div class="kv ${ok(mpc,mpc!==null&&mpc<=g.mins)}"><span>Avg mins / case <small>goal ≤ ${g.mins}</small></span><b>${mpc===null?'—':r1(mpc)}</b></div>
    <div class="kv"><span>QA'd <small>goal ${g.qa}%</small></span><b>${x.qa}${qap===null?'':` <small>(${Math.round(qap)}%)</small>`}</b></div>
    <div class="kv"><span>Accurate</span><b>${x.ok||0}</b></div>
    <div class="kv ${ok(acc,acc!==null&&acc>=g.acc)}"><span>% Accurate <small>goal ≥ ${g.acc}%</small></span><b>${acc===null?'—':r1(acc)+'%'}</b></div></div>`}).join('')}
function overview(p){
  return `<table class="kpi ov"><thead><tr><th rowspan="2">Month</th><th colspan="3" class="a">Abstracting</th><th colspan="3" class="c">Casefinding</th><th colspan="3" class="f">Follow-up</th></tr>
  <tr>${["a","c","f"].map(c=>`<th class="${c}">Cases</th><th class="${c}">Avg min/case</th><th class="${c}">% Accurate</th>`).join('')}</tr></thead><tbody>
  ${[1,2,3,4,5,6].map(m=>{const t=summarize(p,m);return `<tr><td><b>${m}</b> <span class="muted">${KPI[m-1][1]}</span></td>${["a","c","f"].map(k=>{const x=t[k],g=goalFor(k,m);const mpc=x.cases?x.mins/x.cases:null,acc=x.okq?x.ok/x.okq*100:null;
    return `<td>${x.cases||'—'}</td><td class="${mpc===null?'':mpc<=g.mins?'good':'bad'}">${mpc===null?'—':r1(mpc)} <small class="muted">/ ${g.mins}</small></td><td class="${acc===null?'':acc>=g.acc?'good':'bad'}">${acc===null?'—':r1(acc)+'%'}</td>`}).join('')}</tr>`}).join('')}</tbody></table>`}
function logView(){
  const p=lp; if(lm===null){const cm=planMonth(p,today);lm=cm<1?1:cm>6?6:cm}
  const ppl=`<div class="ppl">${P.map(i=>`<button data-lp="${i}" class="${i===p?'on':''}">${esc(S.names[i])}</button>`).join('')}</div>`;

  const s=lm===7?dayN(p,181):dayN(p,(lm-1)*30+1), e=lm===7?LAST_WEEK_END:dayN(p,lm*30);
  const rows=logDays(p,lm).map(([d,a])=>{const k=MEAS[a];const n=Math.floor((D(d)-D(S.starts[p]))/864e5)+1;const site=a==="Abstracting"?siteFor(monday(d),p):"";
    if(!k)return `<tr class="nm"><td class="nw">${fmt(d,{weekday:'short',month:'numeric',day:'numeric'})}</td><td>${n}</td><td><span class="pill ${kcls(a)}">${esc(a)}</span></td><td colspan="7" class="muted">Not measured</td></tr>`;
    const v=entry(p,d);const qv=pnum(v.q),okv=pnum(v.ok);const pa=(qv&&okv!==null)?r1(okv/qv*100)+'%':'';const mpc=(pnum(v.c)&&pnum(v.m)!==null)?r1(pnum(v.m)/pnum(v.c)):'';
    const inp=(f,ph,w)=>`<input class="lg" style="width:${w}px" data-lg="${p}|${d}|${f}" value="${esc(v[f]??'')}" placeholder="${ph}" inputmode="decimal">`;
    return `<tr><td class="nw">${fmt(d,{weekday:'short',month:'numeric',day:'numeric'})}</td><td>${n}</td><td><span class="pill ${kcls(a)}">${esc(a)}${site?' – '+esc(site):''}</span></td>
    <td>${inp('m','min',70)}</td><td>${inp('c','#',56)}</td><td class="mpc" id="mpc-${p}-${d}">${mpc}</td><td>${inp('q','#',56)}</td><td>${inp('ok','#',56)}</td><td class="mpc ${qv&&okv>qv?'bad':''}" id="pa-${p}-${d}">${pa}</td>
    <td><input class="lg" style="width:100%;min-width:140px" data-lg="${p}|${d}|n" value="${esc(v.n??'')}" placeholder="Notes"></td></tr>`}).join('');
  return `${ppl}<div class="row" style="justify-content:space-between"><div>${mons}</div><button class="btn" id="copylog">Copy log for Excel</button></div>
  <p class="muted" style="margin:0 0 12px">${lm===7?'From '+fmt(s):fmt(s)+' – '+fmt(e)} · Enter productive minutes and cases for each day. QA'd = cases reviewed by QA; Accurate = how many of those had no errors. % Accurate is calculated. Goals come from the 6-Month Success Plan tab.</p>
  <div class="sumgrid" id="logsum">${sumCards(p,lm)}</div>
  <div class="wrap" style="margin-top:14px"><table class="log"><thead><tr><th>Date</th><th>Day #</th><th>Assignment</th><th>Productive mins</th><th>Cases</th><th>Mins / case</th><th>QA'd</th><th>Accurate</th><th>% Accurate</th><th>Notes</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="10" class="muted">No scheduled work days in this period.</td></tr>'}</tbody></table></div>
  <h2 style="margin-top:22px">6-month overview</h2><div class="card" style="padding:0;overflow:auto" id="logov">${overview(p)}</div>`;
}

  <tr>${["a","c","f"].map(c=>`<th class="${c}">% QA'd</th><th class="${c}">Avg mins / case</th><th class="${c}">% Accuracy</th>`).join('')}</tr></thead>
  <tbody>${rows}</tbody></table>
  <p class="muted" style="padding:10px 14px;margin:0">*If goals are not met by the end of each phase, the employee will remain in that phase until goals are met. Minutes per case step down each month to the standard (80 min abstracting, 6 min casefinding and follow-up); lower is better, and an employee meets the goal at or under the target. Click a minutes value to adjust it. Highlighted row = current month.</p></div>
  <div class="eval">
  ${ev('d30',30,"Has the employee met KPIs for Discovery / Training (Month 1)?","Continue to Implementation Phase 1.","The employee will remain in the Discovery / Training phase until goals are met.")}
  ${ev('d60',60,"Has the employee met KPIs for Implementation Phase 1?","Continue to Implementation Phase 2.","The employee will remain in Implementation Phase 1 until goals are met.")}
  ${ev('d90',90,"Has the employee met KPIs for Implementation Phase 2?","Continue to Growth Phase 1.","The employee will remain in Implementation Phase 2 until goals are met.")}
  ${ev('d120',120,"Has the employee met KPIs for Growth Phase 1?","Continue to Growth Phase 2.","The Management Team will reevaluate whether the employee is the best fit for the Penn Cancer Registry and decide to either continue the introductory period or discontinue the working relationship.")}
  ${ev('d180',180,"Has the employee met KPIs for Growth Phase 3?","Continue to Maintenance Phase – the introductory period is lifted and the employee is expected to perform at Maintenance Phase going forward.","The management team has the discretion to either let the employee go or continue to work with the employee to meet these goals.")}
  </div></div>`;
}
function render(){
  if(!unlocked){document.getElementById('app').innerHTML=lockView();setTimeout(()=>{const i=document.getElementById('pin1');if(i)i.focus()},0);return}
  saveView();
  const body=tab==="calendar"?calendarView():tab==="weekly"?weeklyView():tab==="success"?successView():tab==="log"?logView():tab==="plan"?planView():setupView();
  document.getElementById('app').innerHTML=header()+`<main>${body}</main>`+modalView();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-m],[data-sp],[data-lp],[data-lm],#copylog,[data-day],#closem,#modalbg,#lockbtn,#chgpin,#addhol,#addsite,[data-hx],[data-sx],#copytsv');
  if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render()}
  else if(t.dataset.m){mi=+t.dataset.m;render()}
  else if(t.dataset.sp!==undefined){sp=+t.dataset.sp;render()}
  else if(t.dataset.lp!==undefined){lp=+t.dataset.lp;lm=null;render()}
  else if(t.dataset.lm!==undefined){lm=+t.dataset.lm;render()}
  else if(t.id==="lockbtn"){forgetUnlock();unlocked=false;render()}
  else if(t.id==="chgpin"){const a=document.getElementById('np1').value,b=document.getElementById('np2').value,n=document.getElementById('pinnote');
    if(a.length<4){n.textContent='Use at least 4 digits.';return}if(a!==b){n.textContent="PINs don't match.";return}
    hashPin(a).then(h=>{S.pinHash=h;rememberUnlock();changed()})}
  else if(t.id==="copylog"){const p=lp;const L=[["Employee","Date","Day #","Plan month","Assignment","Site","Productive mins","Cases","Mins per case","QA'd","Accurate","% Accurate","Notes"].join("\t")];
    [1,2,3,4,5,6,7].forEach(m=>logDays(p,m).forEach(([d,a])=>{if(!MEAS[a])return;const v=entry(p,d);const c=pnum(v.c),mi=pnum(v.m);
      L.push([S.names[p],fmt(d,{month:'numeric',day:'numeric',year:'numeric'}),Math.floor((D(d)-D(S.starts[p]))/864e5)+1,m===7?'>6':m,a,a==="Abstracting"?siteFor(monday(d),p):"",v.m??"",v.c??"",(c&&mi!==null)?r1(mi/c):"",v.q??"",v.ok??"",(pnum(v.q)&&pnum(v.ok)!==null)?r1(pnum(v.ok)/pnum(v.q)*100):"",(v.n??"").replace(/[\t\n]/g," ")].join("\t"))}));
    try{navigator.clipboard.writeText(L.join("\n")).then(()=>{t.textContent="Copied ✓";setTimeout(()=>t.textContent="Copy log for Excel",1500)},()=>{t.textContent="Copy blocked"})}catch(_){t.textContent="Copy blocked"}}
  else if(t.dataset.day){modal=t.dataset.day;render()}
  else if(t.id==="closem"||(t.id==="modalbg"&&e.target===t)){modal=null;render()}
  else if(t.id==="addhol"){S.holidays.push([today,"New holiday"]);changed()}
  else if(t.dataset.hx!==undefined){S.holidays.splice(+t.dataset.hx,1);changed()}
  else if(t.dataset.sx!==undefined){S.siteList.splice(+t.dataset.sx,1);changed()}
  else if(t.id==="addsite"){const v=document.getElementById('newsite').value.trim();if(v){S.siteList.push(v);changed()}}
  else if(t.id==="copytsv"){
    const lines=[["Week of",...P.flatMap(p=>[S.names[p]+" – Activity",S.names[p]+" – Site"]),"Notes"].join("\t")];
    weeks.forEach(w=>lines.push([fmt(w,{month:'numeric',day:'numeric',year:'numeric'}),...P.flatMap(p=>[weekAct(w,p),weekAct(w,p)==="Abstracting"?siteFor(w,p):""]),NOTES[w]||""].join("\t")));
    try{navigator.clipboard.writeText(lines.join("\n")).then(()=>{t.textContent="Copied ✓";setTimeout(()=>t.textContent="Copy table for Excel",1500)},()=>{t.textContent="Copy blocked"})}catch(_){t.textContent="Copy blocked"}
  }
});
document.addEventListener('change',e=>{
  const t=e.target, ds=t.dataset;
  if(ds.wa){const [p,w]=ds.wa.split('|');setIn(S.weekAct,p,w,t.value);changed()}
  else if(ds.ws){const [p,w]=ds.ws.split('|');setIn(S.sites,p,w,t.value);changed()}
  else if(ds.lg){const [p,d,f]=ds.lg.split('|');S.log[p]=S.log[p]||{};S.log[p][d]=S.log[p][d]||{};const v=t.value.trim();if(v==="")delete S.log[p][d][f];else S.log[p][d][f]=v;
    const e=entry(p,d),c=pnum(e.c),mi=pnum(e.m);const mc=document.getElementById('mpc-'+p+'-'+d);if(mc)mc.textContent=(c&&mi!==null)?r1(mi/c):'';const pc=document.getElementById('pa-'+p+'-'+d);if(pc){const o=pnum(e.ok),q=pnum(e.q);pc.textContent=(q&&o!==null)?r1(o/q*100)+'%':'';pc.classList.toggle('bad',!!(q&&o>q))}
    const ls=document.getElementById('logsum');if(ls)ls.innerHTML=sumCards(+p,lm);const lo=document.getElementById('logov');if(lo)lo.innerHTML=overview(+p);changed(true)}
  else if(ds.min){const [k,i]=ds.min.split('|');const v=parseFloat(t.value);if(v>0){S.mins[k][+i]=v;changed()}}
  else if(ds.ck){const i=ds.ck.indexOf('|');setIn(S.checks,ds.ck.slice(0,i),ds.ck.slice(i+1),t.checked);changed()}
  else if(ds.ev){const [p,k,f]=ds.ev.split('|');S.evals[p]=S.evals[p]||{};S.evals[p][k]=S.evals[p][k]||{};S.evals[p][k][f]=t.value;changed()}
  else if(ds.ov){const [p,d]=ds.ov.split('|');setIn(S.overrides,p,d,t.value);changed()}
  else if(ds.name!==undefined){S.names[+ds.name]=t.value.trim()||S.names[+ds.name];changed()}
  else if(ds.start!==undefined){if(t.value){S.starts[+ds.start]=t.value;changed()}}
  else if(ds.hd!==undefined){S.holidays[+ds.hd][0]=t.value;changed()}
  else if(ds.hn!==undefined){S.holidays[+ds.hn][1]=t.value;changed()}
  else if(ds.sn!==undefined){const old=S.siteList[+ds.sn],v=t.value.trim();if(v){S.siteList[+ds.sn]=v;
    Object.values(S.sites).forEach(o=>Object.keys(o).forEach(k=>{if(o[k]===old)o[k]=v}));changed()}}
});
document.addEventListener('keydown',e=>{if(e.key==="Escape"&&modal){modal=null;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='pinform'){e.preventDefault();pinSubmit()}});
for(const s of stores().slice(0,1)){try{const v=JSON.parse(s.getItem(VKEY)||'null');if(v){tab=v.tab||tab;mi=v.mi??mi;sp=v.sp??sp;lp=v.lp??lp;lm=v.lm??lm}}catch(e){}}
render();
})();
</script>
</body>
</html>
